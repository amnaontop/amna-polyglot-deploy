name: CI Pipeline

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test .NET API
        run: |
          cd backend-dotnet
          dotnet restore
          dotnet test

      - name: Test Python Worker
        run: |
          cd worker-python
          pip install -r requirements.txt
          pip install pytest
          pytest tests/ -v

      - name: Lint Python
        run: |
          pip install flake8
          cd worker-python
          flake8 src/ --max-line-length=100

      - name: Test Frontend
        run: |
          cd frontend-js
          npm install
          npm test -- --watchAll=false

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend-dotnet
          push: true
          tags: amnaa1234/polyglot-backend:latest

      - name: Build and Push Worker
        uses: docker/build-push-action@v5
        with:
          context: ./worker-python
          push: true
          tags: amnaa1234/polyglot-worker:latest

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-js
          push: true
          tags: amnaa1234/polyglot-frontend:latest