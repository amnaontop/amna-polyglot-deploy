version: '3.8'

services:
  frontend:
    image: amnaa1234/polyglot-frontend:latest
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always

  backend:
    image: amnaa1234/polyglot-backend:latest
    ports:
      - "5000:5000"
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    restart: always

  worker:
    image: amnaa1234/polyglot-worker:latest
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    restart: always

  redis:
    image: redis:alpine
    restart: always
